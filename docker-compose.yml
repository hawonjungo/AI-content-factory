services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicontentfactory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AiContentFactory.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicontentfactory};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      Llm__Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Llm__Gemini__Model: ${GEMINI_MODEL:-gemini-2.5-flash}
      Budget__MonthlyLimitUsd: ${BUDGET_MONTHLY_LIMIT_USD:-50}
      Qa__MinimumOverallScoreToProceed: ${QA_MIN_SCORE:-6.0}
      Publishing__PublicBaseUrl: ${PUBLISHING_PUBLIC_BASE_URL:-}
      Publishing__FrontendReturnUrl: ${PUBLISHING_FRONTEND_RETURN_URL:-}
      Publishing__TokenEncryptionKey: ${PUBLISHING_TOKEN_ENCRYPTION_KEY:-}
      Publishing__TikTok__ClientId: ${TIKTOK_CLIENT_KEY:-}
      Publishing__TikTok__ClientSecret: ${TIKTOK_CLIENT_SECRET:-}
      Publishing__YouTube__ClientId: ${YOUTUBE_CLIENT_ID:-}
      Publishing__YouTube__ClientSecret: ${YOUTUBE_CLIENT_SECRET:-}
      Publishing__Instagram__ClientId: ${INSTAGRAM_APP_ID:-}
      Publishing__Instagram__ClientSecret: ${INSTAGRAM_APP_SECRET:-}
      Publishing__Facebook__ClientId: ${FACEBOOK_APP_ID:-}
      Publishing__Facebook__ClientSecret: ${FACEBOOK_APP_SECRET:-}
    volumes:
      - asset_storage:/app/storage
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  asset_storage:
